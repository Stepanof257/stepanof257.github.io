<style>
/* Layout: one full-bleed 3D desk; HTML documents and the monitor UI are projected onto 3D planes. Single dark world by design. */
:root {
  --night: #07090d;
  --wall: #121620;
  --console: #0a1520;
  --console-2: #0f1e2c;
  --console-line: #1d3346;
  --console-ink: #d3e6f4;
  --console-dim: #7894aa;
  --signal: #5cc8ff;
  --clear: #35c97d;
  --flag: #ff5a4f;
  --amber: #ffb547;
  --paper: #f2eee4;
  --paper-ink: #1f1b16;
  --paper-dim: #6d655a;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-hand: "Caveat", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--console-ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; }
#stage { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#layer { position: absolute; inset: 0; pointer-events: none; }
.proj { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: auto; backface-visibility: hidden; }
.gone { opacity: 0 !important; pointer-events: none !important; }

/* ---------- monitor ---------- */
#monitor { width: 800px; height: 430px; background: var(--console); overflow: hidden; }
.scr { height: 100%; display: flex; flex-direction: column; font-size: 13px; line-height: 1.35; color: var(--console-ink); background:
  radial-gradient(120% 90% at 50% 0%, rgba(92,200,255,.08), transparent 60%), var(--console); }
.scr-top { display: flex; align-items: center; gap: 12px; padding: 7px 14px; border-bottom: 1px solid var(--console-line); font-family: var(--f-mono); font-size: 11px; color: var(--console-dim); letter-spacing: .04em; text-transform: uppercase; flex-wrap: wrap; }
.scr-top b { color: var(--signal); font-weight: 700; letter-spacing: .14em; }
.scr-top .grow { flex: 1; }
.scr-top .clock { color: var(--amber); font-weight: 700; font-variant-numeric: tabular-nums; }
.scr-body { flex: 1; min-height: 0; padding: 10px 14px; overflow: auto; }
.scr-foot { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--console-line); font-family: var(--f-mono); font-size: 11.5px; color: var(--console-dim); min-height: 34px; }
.scr-foot.ok { background: rgba(53,201,125,.14); color: #bff3d6; }
.scr-foot.bad { background: rgba(255,90,79,.16); color: #ffd1cd; }
.scr-foot .tag { font-weight: 700; padding: 1px 6px; border-radius: 3px; }
.scr-foot.ok .tag { background: var(--clear); color: #04140b; }
.scr-foot.bad .tag { background: var(--flag); color: #1c0503; }
.panel h3 { margin: 0 0 6px; font: 600 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--console-dim); }
.kyc { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; height: 100%; }
.fields { margin: 0; display: grid; gap: 1px; background: var(--console-line); border: 1px solid var(--console-line); }
.fields > div { display: grid; grid-template-columns: 150px 1fr; background: var(--console-2); }
.fields dt { padding: 5px 8px; color: var(--console-dim); font-size: 11.5px; }
.fields dd { margin: 0; padding: 5px 8px; font-family: var(--f-mono); font-size: 12.5px; color: #fff; min-width: 0; overflow-wrap: anywhere; }
.selfie-wrap { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: start; }
.cam { position: relative; width: 132px; aspect-ratio: 100/120; border: 1px solid var(--console-line); overflow: hidden; background: #000; }
.cam svg { display: block; width: 100%; height: 100%; }
.cam::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); pointer-events: none; }
.cam .rec { position: absolute; left: 6px; top: 5px; font: 700 9px var(--f-mono); color: #ff6b61; z-index: 1; }
.meta { margin: 0; font-family: var(--f-mono); font-size: 10.5px; color: var(--console-dim); }
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 11.5px; color: var(--console-dim); }
.signals li::before { content: "› "; color: var(--signal); }
.pill { display: inline-block; font: 700 9.5px var(--f-mono); padding: 2px 6px; border-radius: 3px; letter-spacing: .06em; }
.pill.ok { background: rgba(53,201,125,.18); color: #8ff0bd; }
.pill.new { background: rgba(255,181,71,.18); color: var(--amber); }
.tx { display: grid; gap: 8px; }
.profile { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 1px; background: var(--console-line); border: 1px solid var(--console-line); }
.profile div { background: var(--console-2); padding: 5px 7px; min-width: 0; }
.profile span { display: block; font-size: 10px; color: var(--console-dim); text-transform: uppercase; letter-spacing: .06em; }
.profile b { display: block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: #fff; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table.txs { width: 100%; border-collapse: collapse; font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.txs th { text-align: left; font-weight: 600; color: var(--console-dim); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-bottom: 1px solid var(--console-line); }
.txs td { padding: 3px 6px; border-bottom: 1px solid rgba(29,51,70,.6); white-space: nowrap; }
.txs td.amt { text-align: right; }
.txs .in { color: #8ff0bd; }
.txs .out { color: #e9eef3; }
.txs tr:hover td { background: rgba(92,200,255,.07); }
.totals { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 11.5px; color: var(--console-dim); }
.totals b { color: #fff; }
.loading { height: 100%; display: grid; place-items: center; font-family: var(--f-mono); color: var(--console-dim); letter-spacing: .1em; }

/* ---------- desk documents ---------- */
.desk-doc { cursor: zoom-in; transition: opacity .35s ease, filter .2s; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
.desk-doc:hover, .desk-doc:focus-visible { filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)) brightness(1.12); outline: none; }
.idcard { width: 380px; height: 240px; border-radius: 16px; overflow: hidden; color: #1b2430; font-family: var(--f-body); position: relative;
  background:
    repeating-radial-gradient(circle at 78% 120%, color-mix(in srgb, var(--cc) 14%, transparent) 0 2px, transparent 2px 7px),
    linear-gradient(135deg, #f4f1ea, #e3e7ea 60%, #eef0ec); }
.idcard .band { height: 34px; background: var(--cc); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font: 800 11px var(--f-display); letter-spacing: .08em; }
.idcard .band small { font: 600 9px var(--f-body); letter-spacing: .12em; opacity: .9; }
.idcard .face { position: absolute; left: 14px; top: 42px; width: 86px; height: 103px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(0,0,0,.15); }
.idcard .face svg { width: 100%; height: 100%; display: block; }
.idcard .data { position: absolute; left: 114px; top: 40px; right: 12px; display: grid; grid-template-columns: 1.25fr .55fr 1fr; gap: 2px 10px; }
.idcard .data div { min-width: 0; }
.idcard .data .wide { grid-column: span 3; }
.idcard .data span { display: block; font-size: 7.5px; text-transform: uppercase; letter-spacing: .08em; color: #5d6873; }
.idcard .data b { display: block; font-size: 12px; font-weight: 700; color: #111a24; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idcard .mrz { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px 7px; background: rgba(255,255,255,.55); font: 600 11.6px/1.25 var(--f-mono); letter-spacing: .09em; color: #10161d; white-space: pre; }
.bill { width: 300px; height: 400px; background: var(--paper); color: var(--paper-ink); padding: 20px 22px; font-size: 11px; position: relative; }
.bill .logo { font: 800 15px var(--f-display); color: #1d6b55; letter-spacing: -.01em; }
.bill .logo small { display: block; font: 600 8.5px var(--f-body); color: var(--paper-dim); letter-spacing: .1em; text-transform: uppercase; }
.bill .addr { margin-top: 26px; font-size: 12px; line-height: 1.4; }
.bill .addr b { display: block; }
.bill h4 { margin: 24px 0 8px; font: 800 13px var(--f-body); letter-spacing: .02em; }
.bill dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11px; }
.bill dt { color: var(--paper-dim); }
.bill dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.bill .bars { position: absolute; left: 22px; right: 22px; bottom: 20px; height: 26px; background: repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 4px, #222 4px 5px, transparent 5px 8px); opacity: .7; }
.ticket { width: 220px; height: 340px; background: #faf9f5; color: #222; padding: 16px 16px; font: 500 11px/1.45 var(--f-mono); position: relative; }
.ticket::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: radial-gradient(circle at 5px 0, #faf9f5 5px, transparent 5.5px) 0 0/10px 8px repeat-x; }
.ticket .t-h { font-weight: 700; font-size: 12px; text-align: center; border-bottom: 1px dashed #999; padding-bottom: 8px; margin-bottom: 8px; }
.ticket .big { font-size: 22px; font-weight: 700; text-align: center; margin: 10px 0; }
.binder { width: 240px; height: 310px; border-radius: 6px; background: linear-gradient(90deg, #4c1114 0 22px, #7c1f23 22px); color: #f6dcc9; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; cursor: pointer; font-family: var(--f-display); }
.binder b { font-size: 22px; letter-spacing: .04em; }
.binder span { font: 600 11px var(--f-body); letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
.binder .lbl { background: #f2eee4; color: #3b1012; padding: 6px 14px; font: 700 12px var(--f-mono); }
.sticky { width: 170px; height: 170px; background: linear-gradient(170deg, #ffe680, #f7d54a); color: #3a2f05; padding: 14px; font: 600 23px/1.05 var(--f-hand); box-shadow: 0 6px 12px rgba(0,0,0,.35); }
.plate { width: 340px; height: 120px; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 6px; font: 800 13px var(--f-display); letter-spacing: .14em; pointer-events: none; color: rgba(255,255,255,.75); }
.plate small { display: block; font: 600 10px var(--f-mono); letter-spacing: .1em; opacity: .7; text-align: center; }
.hit { position: absolute; left: 0; top: 0; border-radius: 50%; background: transparent; border: 0; color: transparent; cursor: pointer; pointer-events: auto; padding: 0; }
.hit:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

/* ---------- HUD ---------- */
.hud { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; z-index: 5; }
#hud-l { left: max(16px, env(safe-area-inset-left, 0px)); }
#hud-r { right: max(16px, env(safe-area-inset-right, 0px)); }
.chip { background: rgba(8,12,18,.78); border: 1px solid rgba(120,148,170,.25); border-radius: 999px; padding: 6px 12px; font: 600 12px var(--f-mono); color: var(--console-ink); display: flex; gap: 8px; align-items: center; backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; }
.chip.logo { font: 800 12px var(--f-display); letter-spacing: .12em; color: var(--flag); }
.chip .am { color: var(--amber); }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--signal); }
button.chip:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
kbd { font: 700 10px var(--f-mono); border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 0 4px; opacity: .8; }

/* ---------- overlays ---------- */
.veil { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(4,6,10,.72); backdrop-filter: blur(3px); overflow: auto; }
#inspect { cursor: zoom-out; flex-direction: column; }
#inspect-body { transform-origin: center; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
#inspect p { margin: 18px 0 0; text-align: center; font: 600 12px var(--f-mono); color: var(--console-dim); }
.card { background: var(--paper); color: var(--paper-ink); border-radius: 6px; max-width: 980px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.book { display: grid; grid-template-columns: 1fr 1fr; }
.book > section { padding: 26px 28px; min-width: 0; }
.book > section + section { border-left: 1px solid #d6cfc0; background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 30px); }
.book h2 { margin: 0 0 4px; font: 800 20px var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.book .sub { margin: 0 0 16px; font-size: 13px; color: var(--paper-dim); }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; font-size: 13px; line-height: 1.45; }
.rules .no { font: 700 12px var(--f-mono); color: var(--paper-dim); padding-top: 1px; }
.rules b { display: block; font-size: 13.5px; }
.rules li.isnew b::after { content: "NEW TONIGHT"; margin-left: 8px; font: 700 9px var(--f-mono); letter-spacing: .08em; background: #e5484d; color: #fff; padding: 2px 5px; border-radius: 3px; vertical-align: 2px; }
.ref { display: grid; gap: 18px; }
.ref h3 { margin: 0 0 6px; font: 700 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--paper-dim); }
.ref ul { margin: 0; padding-left: 18px; font-size: 13px; }
.wallets { font-family: var(--f-mono); font-size: 13px; columns: 2; padding-left: 18px; margin: 0; }
.mrzguide { font: 600 11.5px/1.5 var(--f-mono); background: #e6e0d2; padding: 10px 12px; border-radius: 4px; overflow-x: auto; white-space: pre; }
.mrzguide i { font-style: normal; background: #ffd666; }
.mrzguide u { text-decoration: none; background: #a6e3c3; }
.mrzguide s { text-decoration: none; background: #b9d7ff; }
.cta-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
.btn { border: 0; border-radius: 6px; padding: 12px 18px; font: 800 13px var(--f-display); letter-spacing: .06em; cursor: pointer; background: #1f1b16; color: var(--paper); }
.btn:hover { background: #3a3128; }
.btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.btn.red { background: var(--flag); color: #1c0503; }
.btn.red:hover { background: #ff776e; }
.hint { font-size: 12px; color: var(--paper-dim); }

#title { background: radial-gradient(80% 70% at 50% 40%, rgba(7,9,13,.55), rgba(4,6,10,.92)); }
.title-box { max-width: 640px; text-align: left; display: grid; gap: 18px; }
.title-box .eyebrow { font: 600 12px var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
.title-box h1 { margin: 0; font: 800 clamp(48px, 11vw, 112px)/.9 var(--f-display); letter-spacing: -.03em; color: #f5f7fa; }
.title-box h1 span { color: var(--flag); }
.title-box p { margin: 0; font-size: 16px; line-height: 1.55; color: #b9c8d4; max-width: 56ch; }
.title-box .keys { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 500 12px var(--f-mono); color: var(--console-dim); }
.title-box .btn { justify-self: start; background: var(--flag); color: #1c0503; font-size: 15px; padding: 14px 22px; }
.title-box .btn:hover { background: #ff776e; }
.title-box .best { font: 500 12px var(--f-mono); color: var(--console-dim); }

.report { padding: 28px 30px; display: grid; gap: 16px; }
.report h2 { margin: 0; font: 800 26px var(--f-display); letter-spacing: -.01em; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: #d6cfc0; border: 1px solid #d6cfc0; }
.stats div { background: var(--paper); padding: 12px 14px; }
.stats span { display: block; font: 600 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-dim); }
.stats b { font: 800 24px var(--f-display); font-variant-numeric: tabular-nums; }
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.mistakes li { padding: 8px 10px; border-left: 3px solid #e5484d; background: #ebe5d8; }
.mistakes li.fp { border-color: #d9930d; }
.mistakes li b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; }

/* ---------- compact (phones, portrait) ---------- */
.compact #layer { pointer-events: auto; overflow-y: auto; overflow-x: hidden; padding: 56px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; background: rgba(5,7,11,.55); }
.compact:not(.m-desk) .proj { position: relative; transform: none !important; flex: none; }
.compact #monitor { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--console-line); }
.compact .scr-body { overflow: visible; }
.compact .kyc { grid-template-columns: 1fr; }
.compact .profile { grid-template-columns: repeat(2, minmax(0,1fr)); }
.compact .fields > div { grid-template-columns: 120px 1fr; }
.compact #binder, .compact #sticky, .compact #plate { display: none; }
.compact .desk-doc { align-self: center; }
.compact .hit { position: fixed; top: auto !important; left: auto !important; width: auto !important; height: auto !important; bottom: max(14px, env(safe-area-inset-bottom, 0px)); border-radius: 10px; color: #06120b; font: 800 14px var(--f-display); letter-spacing: .1em; padding: 16px 0; z-index: 6; }
.compact #btn-clear { left: max(16px, env(safe-area-inset-left, 0px)) !important; right: calc(50% + 6px); background: var(--clear); }
.compact #btn-flag { right: max(16px, env(safe-area-inset-right, 0px)); left: calc(50% + 6px) !important; background: var(--flag); color: #1c0503; }
.compact .hud { top: max(8px, env(safe-area-inset-top, 0px)); }
.compact .chip.opt, .compact .chip.logo { display: none; }
@media (max-width: 720px) {
  .book { grid-template-columns: 1fr; }
  .book > section + section { border-left: 0; border-top: 1px solid #d6cfc0; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .wallets { columns: 1; }
}
@media (prefers-reduced-motion: reduce) { .desk-doc { transition: none; } }

/* ---------- menu ---------- */
#title { place-items: start center; padding-block: max(32px, 5vh); }
.menu { width: 100%; max-width: 1080px; display: grid; gap: 22px; }
.title-box .keys { margin-top: 2px; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; }
.langs button { border: 1px solid rgba(120,148,170,.35); background: transparent; color: var(--console-ink); border-radius: 999px; padding: 6px 13px; font: 700 12px var(--f-mono); letter-spacing: .08em; cursor: pointer; }
.langs button:hover { border-color: var(--amber); }
.langs button[aria-pressed="true"] { background: var(--amber); color: #1d1300; border-color: var(--amber); }
.langs button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.modes { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; align-items: start; }
.mode { background: rgba(10,21,32,.88); border: 1px solid var(--console-line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; backdrop-filter: blur(6px); }
.mode h2 { margin: 0; font: 800 20px var(--f-display); color: #fff; letter-spacing: -.01em; }
.mode > p { margin: 0; color: #a9bccb; font-size: 14px; line-height: 1.5; }
.mode .btn.red { justify-self: start; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.chapters li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--console-line); border-radius: 8px; background: var(--console-2); }
.chapters li.locked { opacity: .5; }
.chapters b { font: 700 13.5px var(--f-body); color: #fff; }

  else if (flag) { good = false; delta = -8; msg = t('fbFalse', { note: noteText(decoyNote(c, G.active, G.today)) }); }
  else { good = false; delta = -20; msg = t('fbMissed', { why: whyText(c.violations[0]) }); }
  let review = null;
  if (c.review) {
    const juniorRight = c.review.flag === truth;
    review = { who: c.review.who, juniorWrong: !juniorRight, caught: ok && !juniorRight };
    if (review.caught) { delta += 15; msg += ' ' + t('caught', { who: c.review.who }); }
    else if (!ok && juniorRight) msg += ' ' + t('juniorRight', { who: c.review.who });
  }
  if (G.mode === 'career' && !ok) G.mistakes++;
  const mistake = G.mode === 'survival' ? (!ok || (G.hard && flag && !exact)) : !ok;
  let tag;
  if (G.mode === 'career') { G.money += delta; G.levelMoney += delta; tag = `${good ? t('ok') : t('qa')} ${delta >= 0 ? '+' : '−'}${eur0(Math.abs(delta))}`; }
  else {
    if (mistake) { G.lives--; tag = '♥ −1'; }
    else {
      G.score++; tag = '+1';
      G.caseLimit = Math.max(20, (G.hard ? 50 : 45) - G.score);
      const added = survivalUnlock();
      if (added.length) { msg += ' ' + t('newRule', { r: added.map((id) => ruleT(id)[0]).join(', ') }); G.prevActive = G.active.filter((id) => !added.includes(id)); }
    }

  G.done++;
  G.log.push({ ok: ok && !(G.mode === 'survival' && mistake), flag, truth, exact, reasons, timedOut, id: c.id, who: c.type === 'kyc' ? c.app.name : c.profile.name, vio: c.violations, note: !truth && flag ? decoyNote(c, G.active, G.today) : null, review });
  if (!timedOut) { if (flag) pressR = 1; else pressG = 1; sfx.thump(); }
  setTimeout(() => (good ? sfx.good() : sfx.bad()), 120);
  const foot = $('#foot');
  if (foot) { foot.className = 'scr-foot ' + (good ? 'ok' : 'bad'); foot.innerHTML = `<span class="tag">${esc(tag)}</span><span>${esc(msg)}</span>`; }
  updateHUD();
  if (G.coach) {
    G.coach.decided = true; G.coach.focus = null; G.awaitNext = true;
    if (foot) foot.insertAdjacentHTML('beforeend', `<button class="nextbtn" type="button" data-next>${t('coachNext')} →</button>`);
    coachPaint();
    return;
  }
  scheduleNext(!good || review);
}
function scheduleNext(slow) {
  setTimeout(() => { hideDocs(); sfx.paper(); }, slow ? 1900 : 900);
  setTimeout(() => { if (G.state === 'shift') renderLoading(t('loadingNext')); }, slow ? 2500 : 1250);
  setTimeout(() => {
    if (G.state !== 'shift') return;
    if (G.mode === 'survival' && G.lives <= 0) return gameOver();
    if (G.mode === 'career' && G.done >= level().cases) return endLevel();
    nextCase();
  }, slow ? 2900 : 1650);
}

/* ---------- team lead: hand a case to a junior ---------- */
function juniorOdds(c) {
  const v = c.violations[0];
  if (!v) return { kyc: .99, tx: .96, crypto: .93 }[c.type];
  return .5 - .12 * (DIFF[v.rule] || 0);
}
function canDelegate() { return G.mode === 'career' && G.state === 'shift' && !!level() && !!level().deleg && !!G.current && !G.current.review && !G.locked; }
function delegate() {
  if (!canDelegate()) return;
  G.locked = true; closeReasons(); closeBrowser(); if (mDesk) setMDesk(false);
  const c = G.current, truth = c.violations.length > 0, who = pick(JUNIORS);
  const right = rnd() < juniorOdds(c);
  const jFlag = right ? truth : !truth;
  const delta = right ? 5 : jFlag ? -8 : -20;
  G.money += delta; G.levelMoney += delta; if (!right) G.mistakes++;
  G.done++;
  G.log.push({ ok: right, flag: jFlag, truth, exact: false, reasons: false, timedOut: false, id: c.id, who: c.type === 'kyc' ? c.app.name : c.profile.name, vio: c.violations, note: !truth && jFlag ? decoyNote(c, G.active, G.today) : null, review: null, deleg: who });
  let msg = t('delegMsg', { who, v: jFlag ? t('flag') : t('clear'), ok: right });
  if (!right) msg += ' ' + (truth ? whyText(c.violations[0]) : noteText(decoyNote(c, G.active, G.today)));
  const foot = $('#foot');
  if (foot) { foot.className = 'scr-foot ' + (right ? 'ok' : 'bad'); foot.innerHTML = `<span class="tag">${delta >= 0 ? '+' : '−'}${esc(eur0(Math.abs(delta)))}</span><span>${esc(msg)}</span>`; }
  sfx.paper(); setTimeout(() => (right ? sfx.good() : sfx.bad()), 200);
  updateHUD();
  scheduleNext(!right);
}

    'k-surname': C.surname, 'k-given': C.given, 'k-dob': C.dob, 'k-nat': C.nat, 'k-doc': C.doc, 'k-exp': C.exp, 'k-face': t('fPhoto'),

  g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); (g.roundRect ? g.roundRect(18, 250, W - 36, 150, 22) : g.rect(18, 250, W - 36, 150)); g.fill();
  g.textAlign = 'left'; g.fillStyle = '#16181d'; g.font = '800 26px Manrope, sans-serif'; g.fillText(t('phoneFrom'), 36, 292);
  g.font = '500 24px Manrope, sans-serif'; g.fillStyle = '#2b2f38'; wrapText(g, msg, 36, 332, W - 72, 30);
  phoneTex.needsUpdate = true;
}
drawPhone(null);
let phoneT = 0;
function buzzPhone(quiet) {
  const msgs = t('phoneMsgs');
  drawPhone(msgs[rr(0, msgs.length - 1)]);
  phoneT = 4.5;
  if (!quiet) sfx.buzz();
}

/* ---------- team-lead nameplate ---------- */
const plateCanvas = document.createElement('canvas'); plateCanvas.width = 512; plateCanvas.height = 128;
const plateTex = new THREE.CanvasTexture(plateCanvas); plateTex.encoding = THREE.sRGBEncoding; plateTex.anisotropy = 4;
const brass = mat(0x7a5a2a, { r: .35, m: .7 });
const nameplate = new THREE.Mesh(new THREE.BoxGeometry(.2, .05, .012), [brass, brass, brass, brass, new THREE.MeshStandardMaterial({ map: plateTex, roughness: .4, metalness: .3 }), brass]);
nameplate.position.set(.6, .776, -.1); nameplate.rotation.set(-.3, -.25, 0, 'YXZ'); nameplate.castShadow = true; scene.add(nameplate);
function updateNameplate() {
  nameplate.visible = G.state !== 'title' && G.mode === 'career' ? level().ch === 4 : progress.unlocked >= LEVELS.findIndex((l) => l.ch === 4);
  const g = plateCanvas.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, '#2a2620'); gr.addColorStop(1, '#14120f'); g.fillStyle = gr; g.fillRect(0, 0, 512, 128);
  g.strokeStyle = '#c9a25a'; g.lineWidth = 4; g.strokeRect(8, 8, 496, 112);
  g.fillStyle = '#e7c27a'; g.textAlign = 'center';
  const title = tf('chapters', 4).toUpperCase();

  while (g.measureText(title).width > 450 && size > 20) { size -= 2; g.font = `800 ${size}px Unbounded, sans-serif`; }
  g.fillText(title, 256, 68);
  g.font = '600 20px "JetBrains Mono", monospace'; g.fillStyle = '#b8955a'; g.fillText(t('plateLine'), 256, 102);
  plateTex.needsUpdate = true;
}

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), _ndc = new THREE.Vector2();
const TOYS = [
  { objs: [mug, handle, coffee], act: () => { sipCoffee(); if (G.state === 'shift') pause(); } },
  { objs: [lb, shadeMesh, bulb], act: () => { toggleLamp(); if (G.state === 'shift' && G.current && !G.locked) { setTimeout(toggleLamp, 180); useHint(); } } },
  { objs: [keys], act: (h) => typeKeys(h.instanceId) },
  { objs: [phoneMesh, phoneScreen], act: () => buzzPhone(false) },
];
function toyAt(e) {
  if (!renderer || (compact && !mDesk)) return null;
  _ndc.set(e.clientX / VW * 2 - 1, -(e.clientY / VH) * 2 + 1);
  ray.setFromCamera(_ndc, camera);
  const hit = ray.intersectObjects(scene.children, true).find((h) => h.object.visible);
  if (!hit) return null;
  const toy = TOYS.find((x) => x.objs.includes(hit.object));
  return toy ? { toy, hit } : null;
}
canvas.addEventListener('pointermove', (e) => { canvas.classList.toggle('hot', !!toyAt(e)); });
canvas.addEventListener('click', (e) => { const h = toyAt(e); if (h) { ctx(); h.toy.act(h.hit); } });
function animateToys(now, dt) {
  if (mugT > 0) {
    mugT = Math.max(0, mugT - dt / 1.1);
    const s = Math.sin((1 - mugT) * Math.PI);
    mugG.position.set(.68, .75 + s * .07, -.3 + s * .06); mugG.rotation.x = s * .5;
  }
  let dirty = false;
  for (let i = 0; i < 75; i++) if (keyDown[i] > 0) {
    keyDown[i] = Math.max(0, keyDown[i] - dt * 7);
    dummy.position.set(-.203 + (i % 15) * .029, .776 - .0045 * keyDown[i], -.137 + Math.floor(i / 15) * .029); dummy.updateMatrix();
    keys.setMatrixAt(i, dummy.matrix); dirty = true;
  }
  if (dirty) keys.instanceMatrix.needsUpdate = true;
  if (phoneT > 0) {
    phoneT -= dt;
    const j = phoneT > 3.7 ? 1 : 0;
    phoneMesh.position.set(PH.x + (Math.random() - .5) * .005 * j, PH.y, PH.z + (Math.random() - .5) * .005 * j);
    phoneMesh.rotation.y = PH.ry + (Math.random() - .5) * .04 * j;
    if (phoneT <= 0) drawPhone(null);
  }
  spot.intensity = lampOn ? 2.1 + Math.sin(now / 900) * .03 : 0;
}
setTimeout(() => { if (G.state === 'title') buzzPhone(!ac); }, 6000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateNameplate);


/* ---------- admin: type "admin" in the menu, or tap the FLAGGED logo 5 times ---------- */
let toastTimer = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }
function unlockAll() {
  progress.unlocked = LEVELS.length; store.set('flagged-career', progress);
  resetArmed = false; renderMenu(); updateNameplate(); sfx.good(); toast(t('adminOn'));
}
let secret = '';
window.addEventListener('keydown', (e) => {
  if (G.state !== 'title' || e.key.length !== 1) return;
  secret = (secret + e.key.toLowerCase()).slice(-5);
  if (secret === 'admin') { secret = ''; unlockAll(); }
});
let taps = 0, tapAt = 0;
$('#title h1').addEventListener('click', () => { const n = performance.now(); taps = n - tapAt < 700 ? taps + 1 : 1; tapAt = n; if (taps >= 5) { taps = 0; unlockAll(); } });

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now(), px = 0, py = 0, hudTick = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (G.state === 'shift') {
    hudTick += dt;
    if (G.mode === 'career' && G.current && !G.locked && !G.awaitNext) { G.elapsed += dt; G.minute = Math.min(SHIFT_MIN - 1, G.minute + dt * 6); }
    if (G.mode === 'survival' && !G.locked && G.current) {
      G.caseTime += dt;
      if (tbar) { const f = timeLeft() / (G.caseLimit + G.caseBonus); tbar.firstChild.style.transform = `scaleX(${f})`; tbar.classList.toggle('low', f < .25); }
      if (G.caseTime >= G.caseLimit + G.caseBonus) { closeReasons(); closeInspect(); closeBrowser(); decide(false, null, true); }
    }
    if (hudTick > .25) { hudTick = 0; updateHUD(); }
  }
  if (!reduced) { px += (mx - px) * Math.min(1, dt * 3); py += (my - py) * Math.min(1, dt * 3); }
  updateCamera(now, dt);
  animateToys(now, dt);
  pressG = Math.max(0, pressG - dt * 5); pressR = Math.max(0, pressR - dt * 5);
  btnGreen.position.y = BTN_Y - Math.sin(pressG * Math.PI) * .01;
  btnRed.position.y = BTN_Y - Math.sin(pressR * Math.PI) * .01;
  if (renderer) renderer.render(scene, camera);
  if (!compact) projectAll(); else if (mDesk) projectAll(true);
  updateMobileUI();
  requestAnimationFrame(frame);
}
{
  const saved = store.get('flagged-lang', null);
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  applyLang(saved && LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'en');
}
renderLoading(t('standby'));
rootEl.classList.add('in-menu');
resize();
requestAnimationFrame(frame);
if (!renderer) { rootEl.classList.add('compact'); compact = true; }
// debug hook for testing
window.__flagged = { G, LEVELS, makeCase, evaluate, decide, openReasons, pickReason, applyLang, startLevel, startSurvival, endLevel, gameOver, goMenu, unlockAll, flyFrames: (n, orbit = 24) => { const out = [], grab = () => { animateToys(0, .016); renderer.render(scene, camera); out.push(canvas.toDataURL('image/jpeg', .85)); }; for (let k = 0; k < orbit; k++) { updateCamera(20000 + k * 450, 1); grab(); } flyTo(null); const step = fly.dur / n; for (let i = 0; i < n && camMode === 'fly'; i++) { updateCamera(0, step); grab(); } for (let k = 0; k < 10; k++) { updateCamera(0, .05); grab(); } return out; }, show: (c) => { G.current = c; G.locked = false; paintCase(c); }, inspect: () => inspect(G.current.type === 'kyc' ? docs.id : docs.ticket), toys: { sipCoffee, toggleLamp, typeKeys, buzzPhone, cam: () => ({ camMode, pos: curPos.toArray(), look: curLook.toArray() }) } };
